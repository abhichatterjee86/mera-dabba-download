name: Publish APK

# When release.json changes, publish that APK as the latest release.
# The website links to releases/latest/download/mera-dabba.apk, so it always gets the newest one.
# release.json either has "url" (an expo.dev download) or "file" (an APK kept in this repo - used for
# APKs built on GitHub, which have no public download link). The sha256 is always checked.
on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version release.json); SHA=$(jq -r .sha256 release.json); FILE=$(jq -r '.file // empty' release.json)
          if [ -n "$FILE" ]; then
            cp "$FILE" mera-dabba.apk
          else
            curl -fsSL "$(jq -r .url release.json)" -o mera-dabba.apk
          fi
          echo "$SHA  mera-dabba.apk" | sha256sum -c -
          echo "$SHA  mera-dabba.apk" > mera-dabba.apk.sha256
          printf '%s\n\n%s\n\n%s\n' "$(jq -r .notes release.json)" \
            "How to install: https://meradabba.app/download" "SHA-256: $SHA" > notes.md
          gh release delete "v$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION" mera-dabba.apk mera-dabba.apk.sha256 \
            --title "Mera Dabba $VERSION" --notes-file notes.md --latest
